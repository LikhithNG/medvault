<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="MedVault — Medical Records and Bill Checker: Built a phone-first vault for prescriptions, reports and hospital bills: Gemini and open models on Groq read each page, and every record is badged with its source." style="--c1:#3b8cff;--c2:#fb7185">
<style>
text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif}
.sc-cap { font: 600 8.5px "Segoe UI",-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif; letter-spacing: 0.14em; fill: #9a9cab; }
.sc-t { font: 500 10px ui-monospace, "SF Mono", Menlo, monospace; fill: #d4d4de; }
.sc-t.sc-sm { font-size: 8.5px; }
.sc-s { font: 500 8px ui-monospace, "SF Mono", Menlo, monospace; fill: #9a9cab; }
.sc-greek { font: 600 12px "Segoe UI",-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif; }
.sc-box { fill: #15161d; stroke: #2c2d36; }
.sc-hot { stroke: color-mix(in srgb, var(--c1) 55%, transparent); }
.sc-safe { stroke: #5eead4; }
.sc-line, .sc-axis { fill: none; stroke: #3a3b44; stroke-width: 1; }
.sc-wire { fill: none; stroke: color-mix(in srgb, var(--c2) 70%, transparent); stroke-width: 1.5; stroke-dasharray: 3 4; }
.sc-pkt { fill: var(--c1); opacity: 0; }
.sc-c1, .sc-c1-ink { fill: var(--c1); }
.sc-c2, .sc-c2-ink { fill: var(--c2); }
.sc-c1s { fill: none; stroke: var(--c1); stroke-width: 2; stroke-linecap: round; }
.sc-ok { fill: #5eead4; }
.sc-bad, .sc-bad-ink, .sc-fruit { fill: #fb7185; }
.sc-mark { fill: none; stroke: #0b0d14; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sc-flag { fill: #fb7185; }
.sc-on-flag { fill: #0b0d14; font-weight: 700; }
.sc-on-tier { fill: #ececf1; }
.sc-chip1 { fill: color-mix(in srgb, var(--c1) 25%, transparent); }
.sc-chip2 { fill: color-mix(in srgb, var(--c2) 28%, transparent); }
.sc-route { stroke: var(--c2); stroke-width: 3; stroke-linecap: round; opacity: 0.6; }
.sc-stop { fill: #0b0d14; stroke: var(--c2); stroke-width: 1.5; }
.sc-trend { fill: none; stroke: var(--c1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 160; }
.sc-trace { fill: none; stroke: #5b5d6b; stroke-width: 1.2; }
.sc-trace-hot { stroke: var(--c1); }
.sc-scalp { fill: #15161d; stroke: #2c2d36; }
.sc-link { stroke: var(--c2); stroke-width: 1; opacity: 0.45; }
.sc-stem { stroke: var(--c1); stroke-width: 2; stroke-linecap: round; }
.sc-leaf { fill: var(--c1); opacity: 0.85; }
.sc-pot { fill: #2a2b33; stroke: #3a3b44; }
.sc-scan { fill: color-mix(in srgb, var(--c1) 30%, transparent); opacity: 0; }
.sc-pop, .sc-grow, .sc-spin, .sc-light { transform-box: fill-box; transform-origin: center; }
.sc-grow { transform-origin: bottom; }
.sc-wire { animation: sc-dash 0.9s linear infinite; }
.sc-pkt { animation: sc-pkt 1.2s linear infinite; animation-delay: calc(var(--i, 0) * 0.25s); }
.sc-pop { animation: sc-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: calc(0.2s + var(--i, 0) * 0.18s); }
.sc-light { animation: sc-light 0.6s ease-out both; animation-delay: calc(var(--i, 0) * 0.15s); }
.sc-grow { animation: sc-grow 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: calc(0.3s + var(--i, 0) * 0.08s); }
.sc-blink { animation: sc-blink 1.4s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 0.12s); }
.sc-scan { animation: sc-scan 1.8s ease-in-out infinite; }
.sc-move { animation: sc-move 2.4s ease-in-out infinite alternate; animation-delay: calc(var(--i, 0) * -0.8s); }
.sc-scroll { animation: sc-scroll 3s linear infinite; }
.sc-trend { animation: sc-draw 1.2s ease-out both; }
.sc-spin { animation: sc-spin 2.4s linear infinite; }
.sc-converge { animation: sc-converge 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 0.02s); }
@keyframes sc-dash { to { stroke-dashoffset: -14; } }
@keyframes sc-pkt { 0% { opacity: 0; transform: translate(0, 0); } 15%, 85% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
@keyframes sc-pop { from { opacity: 0; transform: scale(0.6); } }
@keyframes sc-light { from { opacity: 0.25; } }
@keyframes sc-grow { from { transform: scaleY(0.3); } }
@keyframes sc-blink { 50% { opacity: 0.3; } }
@keyframes sc-scan { from { opacity: 1; transform: translateY(0); } to { opacity: 1; transform: translateY(var(--dy)); } }
@keyframes sc-move { to { transform: translateX(var(--dx)); } }
@keyframes sc-scroll { to { transform: translateX(var(--dx)); } }
@keyframes sc-draw { from { stroke-dashoffset: 160; } }
@keyframes sc-spin { to { transform: rotate(360deg); } }
@keyframes sc-converge { from { opacity: 0.25; transform: translate(var(--x), var(--y)); } }
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="glow1" cx=".05" cy="0" r=".6"><stop offset="0" stop-color="#3b8cff" stop-opacity=".18"/><stop offset="1" stop-color="#3b8cff" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="1" cy="1" r=".6"><stop offset="0" stop-color="#fb7185" stop-opacity=".12"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#ffffff" fill-opacity=".06"/></pattern>
<clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
<clipPath id="tile"><rect width="520" height="150" rx="10"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="300" fill="#1d1e23"/><rect width="1200" height="300" fill="url(#glow1)"/><rect width="1200" height="300" fill="url(#glow2)"/>
<svg x="44" y="40" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="logo-ink" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="54" y2="56">
      <stop offset="0" stop-color="#3b8cff"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="logo-aura" cx="0.22" cy="0.12" r="1">
      <stop offset="0" stop-color="#3b8cff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#fb7185" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="logo-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#fff" fill-opacity="0.08"/>
    </pattern>
    <filter id="logo-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <clipPath id="logo-tile"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#logo-tile)">
    <rect width="64" height="64" fill="#0b0d14"/>
    <rect width="64" height="64" fill="url(#logo-aura)"/>
    <rect width="64" height="64" fill="url(#logo-dots)"/>
    <path d="M0 0H64V20C44 13 20 13 0 20Z" fill="#fff" fill-opacity="0.05"/>
  </g>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#logo-edge)" stroke-width="1.5"/>
  <g fill="none" stroke="url(#logo-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#logo-glow)" opacity="0.9">
    <path d="M17 11h20l10 10v32H17z"/>
    <path d="M37 11v10h10"/>
    <path d="M29 26h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="url(#logo-ink)" stroke="none"/>
    <path d="M23 49h18" stroke-opacity="0.55"/>
  </g>
  <g fill="none" stroke="url(#logo-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 11h20l10 10v32H17z"/>
    <path d="M37 11v10h10"/>
    <path d="M29 26h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="url(#logo-ink)" stroke="none"/>
    <path d="M23 49h18" stroke-opacity="0.55"/>
  </g>
</svg>
<text x="124" y="80" font-size="13" font-weight="600" letter-spacing="2" fill="#5eead4">OCT 2026</text>
<text x="44" y="164" font-size="38" font-weight="700" fill="#ececf1">MedVault</text>
<text x="44" y="198" font-size="21" font-weight="500" fill="#c9c6ff">Medical Records and Bill Checker</text>
<text x="44" y="249" font-size="14" fill="#9a9ba6">Streamlit · Gemini · Groq · Turso · CMS APIs</text>
<g transform="translate(470 48) scale(1.35)">
<g clip-path="url(#tile)"><rect width="520" height="150" fill="#0b0d14"/><rect width="520" height="150" fill="url(#dots)"/><text class="sc-cap" x="16" y="22" text-anchor="start">THE BILL</text><rect class="sc-box" x="16" y="30" width="172" height="84" rx="8"/><rect class="sc-scan" x="18" y="34" width="168" height="18" rx="3" style="--dy:44px"/><text class="sc-t sc-sm" x="24" y="47" text-anchor="start">72148 MRI</text><text class="sc-t sc-sm" x="146" y="47" text-anchor="end">$9,374.04</text><g class="sc-pop" style="--i:0"><rect class="sc-flag" x="151" y="37" width="32" height="14" rx="4"/><text class="sc-t sc-sm sc-on-flag" x="167" y="47" text-anchor="middle">49×</text></g><text class="sc-t sc-sm" x="24" y="69" text-anchor="start">70450 CT head</text><text class="sc-t sc-sm" x="146" y="69" text-anchor="end">$3,076.10</text><g class="sc-pop" style="--i:1"><rect class="sc-flag" x="151" y="59" width="32" height="14" rx="4"/><text class="sc-t sc-sm sc-on-flag" x="167" y="69" text-anchor="middle">29×</text></g><text class="sc-t sc-sm" x="24" y="91" text-anchor="start">80048 BMP</text><text class="sc-t sc-sm" x="146" y="91" text-anchor="end">$241.00</text><g class="sc-pop" style="--i:2"><rect class="sc-flag" x="151" y="81" width="32" height="14" rx="4"/><text class="sc-t sc-sm sc-on-flag" x="167" y="91" text-anchor="middle">29×</text></g><text class="sc-s" x="26" y="108" text-anchor="start">Sample bill from the app</text><path class="sc-wire" d="M194 72L248 72"/><circle class="sc-pkt" cx="194" cy="72" r="2.6" style="--dx:54px;--dy:0px;--i:0"/><text class="sc-cap" x="254" y="22" text-anchor="start">CHECKED AGAINST</text><rect class="sc-box" x="254" y="32" width="118" height="38" rx="8"/><text class="sc-t sc-sm" x="313" y="48" text-anchor="middle">Hospital's CMS</text><text class="sc-t sc-sm" x="313" y="61" text-anchor="middle">price file</text><rect class="sc-box" x="254" y="78" width="118" height="38" rx="8"/><text class="sc-t sc-sm" x="313" y="94" text-anchor="middle">Medicare rate</text><text class="sc-s" x="313" y="107" text-anchor="middle">MRI $191.72 · 49×</text><path class="sc-wire" d="M378 72L422 72"/><circle class="sc-pkt" cx="378" cy="72" r="2.6" style="--dx:44px;--dy:0px;--i:1"/><text class="sc-cap" x="428" y="22" text-anchor="start">YOU SEND</text><g class="sc-pop" style="--i:3"><rect class="sc-box sc-hot" x="428" y="32" width="76" height="84" rx="8"/><text class="sc-t sc-sm" x="466" y="56" text-anchor="middle">Dispute</text><text class="sc-t sc-sm" x="466" y="69" text-anchor="middle">letter</text><rect class="sc-chip2" x="440" y="84" width="52" height="16" rx="4"/><text class="sc-s" x="466" y="95.5" text-anchor="middle">+ receipt</text></g><text class="sc-s sc-foot" x="16" y="140" text-anchor="start">Every flag carries the published price, its basis, the source file and its date</text></g>
<rect x=".5" y=".5" width="519" height="149" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</g>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
