# Pinned light. A health record is read at a hospital desk, often on someone else's screen,
# and the card has to look the same every time. Inheriting the viewer's dark-mode preference
# turned the paste box black and the captions invisible.
[theme]
base = "light"
primaryColor = "#403CD5"
backgroundColor = "#F4F4F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16165C"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 25
# serves static/ at /app/static/ - needed for the web manifest and the home-screen icons
enableStaticServing = true
